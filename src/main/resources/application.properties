# =============================================
# Spring Boot
# =============================================
spring.application.name=accounts
server.port=${PORT:8081}
spring.config.import=optional:file:./.environments/application-secrets.properties

# El DataSource se configura a mano en DataSourceSpringConfig
spring.autoconfigure.exclude[0]=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# =============================================
# Base de datos TiDB (MySQL) — misma base crud_usuarios que users
# =============================================
db.host=${DB_HOST:localhost}
db.port=${DB_PORT:3306}
db.name=${DB_NAME:crud_usuarios}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:}
db.ssl-mode=${DB_SSL_MODE:DISABLED}

# =============================================
# Kafka (Aiven) — paso 7: publica "cuenta creada" en el topico 'notificaciones'
# En Aiven: KAFKA_SECURITY_PROTOCOL=SASL_SSL y KAFKA_SASL_MECHANISM=SCRAM-SHA-256.
# KAFKA_CA_CERT es el contenido de ca.pem (en una linea con \n, o con saltos reales).
# =============================================
kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
kafka.topic=${KAFKA_TOPIC:notificaciones}
kafka.security-protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
kafka.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
kafka.username=${KAFKA_USERNAME:}
kafka.password=${KAFKA_PASSWORD:}
kafka.ca-cert=${KAFKA_CA_CERT:}
kafka.send-timeout=${KAFKA_SEND_TIMEOUT:30s}

# =============================================
# Guia 10: cache Valkey (Aiven). VALKEY_URI = Service URI (rediss://...).
# Si VALKEY_URI esta vacio, la cache se desactiva y todo va a la base de datos.
# CACHE_ACCOUNT_TTL = segundos que dura cada cuenta en la cache.
# =============================================
cache.valkey.uri=${VALKEY_URI:}
cache.account.ttl-seconds=${CACHE_ACCOUNT_TTL:600}
cache.valkey.timeout-ms=${VALKEY_TIMEOUT_MS:2000}

# Swagger UI en /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
