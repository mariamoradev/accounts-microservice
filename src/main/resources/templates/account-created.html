<!DOCTYPE html>
<html lang="es">
<body style="font-family: Arial, sans-serif; color: #222; line-height: 1.5;">
  <h2 style="color: #1f4e79;">¡Tu cuenta fue creada!</h2>
  <p>Hola <strong>{{name}}</strong>,</p>
  <p>Tu cuenta en <strong>Gestion de Usuarios</strong> ya esta lista.</p>
  <table style="border-collapse: collapse;">
    <tr><td style="padding: 4px 12px 4px 0;">Numero de cuenta:</td><td><strong>{{accountNumber}}</strong></td></tr>
    <tr><td style="padding: 4px 12px 4px 0;">Saldo inicial:</td><td><strong>$ {{balance}}</strong></td></tr>
    <tr><td style="padding: 4px 12px 4px 0;">Estado:</td><td><strong>{{status}}</strong></td></tr>
  </table>
  <p style="color: #666; font-size: 12px;">Este correo fue enviado automaticamente por el microservicio accounts.</p>
</body>
</html>
